<div class="flex justify-center ">
    <div class="w-5/6 py-6">
        <h1 class="text-2xl pb-4">Add A Project</h1>
        <div class="w-full bg-grey-light">
            <form class="grid md:grid-cols-12 grid-cols-1 gap-4 bg-md-grey py-4 text-base" [formGroup]="projectForm" (ngSubmit)="onSubmit()">
                <div class="md:col-span-8 col-span-12 px-10 md:row-start-1 row-start-2">
                    <div  class="flex flex-col gap-y-2 bg-l-grey p-4" [ngClass]="{'hidden': !showProjectInfo}">
                            <label for="project-name">Project Name: </label>
                            <input id="project-name" type="text" formControlName="projectName">
                            <br />
                            <label for="project-type">Project Type: </label>
                            <select id="project-type" class="bg-lighter-grey" formControlName="projectType" (change)="onProjectTypeChange()">
                                <option [ngValue]="null">Select a type (optional)</option>
                                <option *ngFor="let type of projectTypes" [ngValue]="type.id">
                                  {{ type.name }}
                                </option>
                            </select>
                            <br />
                            <label for="project-tags-input">Tags: </label>
                            <div class="flex flex-wrap gap-2 mb-2">
                              <span
                                *ngFor="let tag of projectTags"
                                class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-lighter-grey"
                              >
                                {{ tag }}
                                <button type="button" class="text-a-yellow" (click)="removeProjectTag(tag)">×</button>
                              </span>
                            </div>
                            <input
                              id="project-tags-input"
                              type="text"
                              list="project-tag-suggestions"
                              [(ngModel)]="projectTagInput"
                              [ngModelOptions]="{standalone: true}"
                              placeholder="Type a tag and press Enter, or pick an existing one"
                              (keydown)="onProjectTagInputKeydown($event)"
                              (blur)="addProjectTag()"
                            >
                            <datalist id="project-tag-suggestions">
                              <option *ngFor="let tag of availableTags" [value]="tag"></option>
                            </datalist>
                            <br />
                            <ng-container *ngIf="isBuildsProject">
                              <label for="project-role">Role: </label>
                              <input id="project-role" type="text" formControlName="projectRole">
                              <br />
                            </ng-container>
                            <ng-container *ngIf="showProjectUrlField">
                              <label for="project-url">URL: </label>
                              <input id="project-url" type="url" formControlName="projectUrl" placeholder="https://">
                              <br />
                            </ng-container>
                            <ng-container *ngIf="showGithubUrlField">
                              <label for="project-github-url">GitHub URL: </label>
                              <input id="project-github-url" type="url" formControlName="githubUrl" placeholder="https://github.com/...">
                              <br />
                            </ng-container>
                            <ng-container *ngIf="showPlatformTechFields">
                              <label for="project-platform">Platform: </label>
                              <input id="project-platform" type="text" formControlName="projectPlatform">
                              <br />
                              <label for="project-tech-input">Tech: </label>
                              <div class="flex flex-wrap gap-2 mb-2">
                                <span
                                  *ngFor="let tag of techTags"
                                  class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-lighter-grey"
                                >
                                  {{ tag }}
                                  <button type="button" class="text-a-yellow" (click)="removeTechTag(tag)">×</button>
                                </span>
                              </div>
                              <input
                                id="project-tech-input"
                                type="text"
                                [(ngModel)]="techInput"
                                [ngModelOptions]="{standalone: true}"
                                placeholder="Type a name and press Enter"
                                (keydown)="onTechInputKeydown($event)"
                                (blur)="addTechTag()"
                              >
                              <br />
                            </ng-container>
                            <label for="project-description">Project Description: </label>
                            <textarea id="project-description" type="text" formControlName="projectDescription"></textarea>
                            <br />
                            <label for="project-overview">Project Overview: </label>
                            <textarea id="project-overview" type="text" formControlName="projectOverview"></textarea>
                            <ng-container *ngIf="isBuildsProject">
                              <br />
                              <p class="font-semibold">Build Display</p>
                              <label class="flex items-center gap-2">
                                <input type="radio" name="displayMode" value="media" [checked]="displayMode === 'media'" (change)="onDisplayModeChange('media')" />
                                Media-only project
                              </label>
                              <label class="flex items-center gap-2">
                                <input type="radio" name="displayMode" value="web_game" [checked]="displayMode === 'web_game'" (change)="onDisplayModeChange('web_game')" />
                                Playable web game (upload zip)
                              </label>
                            </ng-container>
                    </div>
                    <div id="mediaInfo" class="flex flex-col gap-y-2" [ngClass]="{'hidden': !showMediaInfo || !isMediaMode}" formArrayName="media">
                        <div class="flex gap-4 items-center">
                            <label class="border-2 border-lighter-grey px-4 py-2 cursor-pointer">
                                Upload Files
                                <input class="hidden" type="file" accept="image/*,video/*" multiple (change)="onBulkFilesSelected($event)" />
                            </label>
                            <button type="button" (click)="deleteSelectedMedia()">Delete Selected</button>
                        </div>
                        <div class="flex flex-col gap-y-2 bg-l-grey p-4" *ngFor="let item of media.controls; let i=index" [formGroupName]="i">
                            <label>
                                <input type="checkbox" (change)="toggleMediaSelection(i, $any($event.target).checked)" />
                                Select for deletion
                            </label>
                            <label for="media-name-{{i}}">Media Name: </label>
                            <input id="media-name-{{i}}" type="text" formControlName="mediaName">
                        </div>
                    </div>
                    <div id="gameInfo" class="flex flex-col gap-y-2 bg-l-grey p-4" [ngClass]="{'hidden': !showGameInfo || !isWebGameMode}">
                        <p>Upload a .zip containing your web export (Godot, Unity WebGL, etc.) with an index.html entry point.</p>
                        <label class="border-2 border-lighter-grey px-4 py-2 cursor-pointer inline-block w-fit">
                            Upload Game ZIP
                            <input class="hidden" type="file" (change)="onGameZipSelected($event)" />
                        </label>
                        <p *ngIf="gameZipFile">{{ gameZipFile.name }}</p>
                    </div>
                </div>
                
                <div class="md:col-span-4 col-span-12 text-2xl text-center md:border-l-2 md:border-b-0 border-b-2 border-white flex md:flex-col flex-row md:gap-x-2 gap-y-4 gap-x-12 md:justify-start justify-center">
                   <div class="hover:bg-l-grey cursor-pointer md:p-2 p-4" (click)="toggleInfoToShow('project')">Project Info</div>
                   <div class="hover:bg-l-grey cursor-pointer md:p-2 p-4" *ngIf="isMediaMode" (click)="toggleInfoToShow('media')">Media Info</div>
                   <div class="hover:bg-l-grey cursor-pointer md:p-2 p-4" *ngIf="isWebGameMode" (click)="toggleInfoToShow('game')">Game Upload</div>
                </div>
                <div class="col-span-8 text-center">
                    <button class="text-xl mt-12" type="submit">Submit</button>
                </div>
            </form>
        </div>
    </div>
</div>
